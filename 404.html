<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Aventis Junk Removal</title>
  <meta name="description" content="The page you're looking for isn't here.">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/oswald/v57/TK3IWkUHHAIjg75cFRf3bXL8LICs1_Fv40pKlN4NNSeSASz7FmlWHYjMdZwl.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/opensans/v44/memvYaGs126MiZpBA-UvWbX2vVnXBbObj2OVTS-mu0SC55I.woff2">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="css/style.css?v=20260524">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
  <style>
    .not-found {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 80px 24px;
      background: var(--color-black);
    }
    .not-found-inner { max-width: 480px; }
    .not-found-code {
      font-family: var(--font-heading);
      font-size: 5rem;
      font-weight: 700;
      color: var(--color-gold);
      letter-spacing: 4px;
      line-height: 1;
      margin-bottom: 16px;
    }
    .not-found h1 {
      font-family: var(--font-heading);
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--color-white);
      margin-bottom: 12px;
    }
    .not-found p {
      color: var(--color-light-gray);
      margin-bottom: 32px;
      font-size: 1.05rem;
      line-height: 1.7;
    }
    .not-found-logo {
      width: 120px;
      height: auto;
      margin: 0 auto 24px;
      display: block;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <main class="not-found">
    <div class="not-found-inner">
      <picture>
        <source srcset="images/logo.webp?v=20260524" type="image/webp">
        <img src="images/logo.png?v=20260524" alt="Aventis Junk Removal" class="not-found-logo" width="420" height="107">
      </picture>
      <p class="not-found-code">404</p>
      <h1>Page not found</h1>
      <p>The page you're looking for has moved, or never existed. Let's get you back to the home page.</p>
      <a href="/" class="btn btn-primary">&larr; Back to Home</a>
    </div>
  </main>
</body>
</html>
